# =============================================================================
# NewTabLinks backend - application configuration
#
# Every parameter is declared here with a working default, in the form
# ${ENVIRONMENT_VARIABLE:default}. Nothing has to be set for the application to
# start locally; a deployment overrides what it needs by setting the matching
# environment variable, and never by editing this file.
#
# Anything genuinely secret (database password above all) has no usable default
# on purpose - it is injected from the cluster secret store at runtime.
# =============================================================================

# --- application identity ----------------------------------------------------
spring.application.name=${SPRING_APPLICATION_NAME:new-tab-links-backend}

# --- http server -------------------------------------------------------------
# 8080 matches the Helm chart's default containerPort, so the probe and the
# service find the application without extra configuration.
server.port=${SERVER_PORT:8080}
server.error.whitelabel.enabled=${SERVER_ERROR_WHITELABEL_ENABLED:false}
# Return a 404 through the exception handler instead of an empty default page.
spring.web.resources.add-mappings=${SPRING_WEB_RESOURCES_ADD_MAPPINGS:false}

# --- datasource --------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newtablinks}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:newtablinks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:newtablinks}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_POOL_MIN_IDLE:2}

# --- jpa / hibernate ---------------------------------------------------------
# ddl-auto=update lets the schema follow the entities during local development.
#
# IMPORTANT: the schema is owned by the Flyway migrations repository, which runs
# as an init container before this application starts. Once those migrations
# exist, deployed environments MUST override this with
#   SPRING_JPA_HIBERNATE_DDL_AUTO=validate
# so that Hibernate checks the migrated schema instead of quietly changing it.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_TIME_ZONE:UTC}

# --- flyway ------------------------------------------------------------------
# Disabled inside the application on purpose. Migrations live in their own
# repository, are shipped as a Docker image, and run as a Kubernetes init
# container before this pod starts. The application must never migrate its own
# schema - it would race the init container and split ownership of the schema.
#
# The schema version this build expects comes from the Maven property
# flyway.migrations.schema.version and is published at /actuator/info as
# build.flywayMigrationsSchemaVersion, so a running pod can be compared against
# the migration image tag that actually ran.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# --- openapi / swagger ui ----------------------------------------------------
newtablinks.openapi.title=${NEWTABLINKS_OPENAPI_TITLE:NewTabLinks backend API}
newtablinks.openapi.version=${NEWTABLINKS_OPENAPI_VERSION:v1}
newtablinks.openapi.description=${NEWTABLINKS_OPENAPI_DESCRIPTION:Stores and synchronizes the link hierarchy of the NewTabGroupedLinks browser extension.}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:alpha}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}

# --- websocket ---------------------------------------------------------------
# Transport only for now; no message is published until user identity exists.
# The default origin pattern allows the Chrome extension, whose pages are served
# from chrome-extension://<extension id>.
newtablinks.websocket.endpoint-path=${NEWTABLINKS_WEBSOCKET_ENDPOINT_PATH:/ws}
newtablinks.websocket.user-destination-prefix=${NEWTABLINKS_WEBSOCKET_USER_DESTINATION_PREFIX:/user}
newtablinks.websocket.allowed-origin-patterns=${NEWTABLINKS_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:chrome-extension://*}

# --- authentication ----------------------------------------------------------
# Access tokens are short lived because nothing can revoke one before it expires;
# revocation acts on the refresh token, which is why that one is stored.
newtablinks.auth.access-token-lifetime=${NEWTABLINKS_AUTH_ACCESS_TOKEN_LIFETIME:PT15M}
newtablinks.auth.refresh-token-lifetime=${NEWTABLINKS_AUTH_REFRESH_TOKEN_LIFETIME:P30D}
newtablinks.auth.activation-token-lifetime=${NEWTABLINKS_AUTH_ACTIVATION_TOKEN_LIFETIME:PT24H}
# Shorter than activation on purpose: a reset link is a live takeover of an existing
# account, whereas an activation link only finishes creating an empty one.
newtablinks.auth.password-reset-token-lifetime=${NEWTABLINKS_AUTH_PASSWORD_RESET_TOKEN_LIFETIME:PT1H}
# The website exchanges this immediately, so it only has to survive one redirect.
newtablinks.auth.web-session-handoff-lifetime=${NEWTABLINKS_AUTH_WEB_HANDOFF_LIFETIME:PT2M}
# Long enough for a person to read a code off one screen and type it into another.
newtablinks.auth.extension-connect-lifetime=${NEWTABLINKS_AUTH_EXTENSION_CONNECT_LIFETIME:PT10M}
newtablinks.auth.maximum-failed-login-attempts=${NEWTABLINKS_AUTH_MAX_FAILED_LOGINS:10}
newtablinks.auth.jwt-issuer=${NEWTABLINKS_AUTH_JWT_ISSUER:https://newtablinks.local}
#
# DEVELOPMENT VALUE ONLY. Every deployment MUST override this with a long random
# secret from the cluster secret store: anyone holding it can mint access tokens
# for any account. The application refuses to start if it is shorter than 32 bytes.
newtablinks.auth.jwt-signing-secret=${NEWTABLINKS_AUTH_JWT_SIGNING_SECRET:development-only-signing-secret-not-for-any-deployment}

# --- security ----------------------------------------------------------------
# Browser origins allowed to call this API: the website, and the extension whose
# pages are served from chrome-extension://<extension id>.
newtablinks.security.allowed-cors-origins=${NEWTABLINKS_SECURITY_ALLOWED_CORS_ORIGINS:http://localhost:5173,chrome-extension://*}

# --- provider sign-in --------------------------------------------------------
# Deliberately NOT declared here. Spring Boot validates client registrations on
# startup and refuses to boot when a declared client id is empty, so declaring
# Google with an empty default would make credentials mandatory just to start.
# The security configuration wires provider sign-in only when a registration
# exists, and logs a warning when it does not.
#
# To enable Google, set these three as environment variables (or add them to a
# profile-specific properties file):
#
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,email,profile
#
# The redirect URI to register in the Google console is
#   <this service's public base url>/login/oauth2/code/google

# --- the public website ------------------------------------------------------
# Separate project; the backend only needs to build links into it.
newtablinks.web.base-url=${NEWTABLINKS_WEB_BASE_URL:http://localhost:5173}
newtablinks.web.activation-path=${NEWTABLINKS_WEB_ACTIVATION_PATH:/activate}
newtablinks.web.oauth-callback-path=${NEWTABLINKS_WEB_OAUTH_CALLBACK_PATH:/auth/callback}
newtablinks.web.password-reset-path=${NEWTABLINKS_WEB_PASSWORD_RESET_PATH:/reset-password}

# --- outgoing mail -----------------------------------------------------------
# Disabled by default: with no provider configured, messages are written to the log
# with the activation link intact, so the whole flow works in development.
# Set NEWTABLINKS_MAIL_ENABLED=true once SMTP credentials exist.
newtablinks.mail.enabled=${NEWTABLINKS_MAIL_ENABLED:false}
newtablinks.mail.from-address=${NEWTABLINKS_MAIL_FROM_ADDRESS:no-reply@newtablinks.local}
newtablinks.mail.from-name=${NEWTABLINKS_MAIL_FROM_NAME:NewTabLinks}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# --- actuator ----------------------------------------------------------------
# health is what the Kubernetes probes call; info carries the build metadata,
# including the expected Flyway schema version.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.info.build.enabled=${MANAGEMENT_INFO_BUILD_ENABLED:true}
# The mail relay is deliberately excluded from the health aggregate. Kubernetes
# probes this endpoint for BOTH liveness and readiness, so leaving mail in would
# let an unreachable SMTP relay - a non-critical, best-effort dependency whose
# failures are already caught and logged - restart a perfectly healthy API in a
# loop. Mail problems belong in the logs, not in the liveness probe.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.info.java.enabled=${MANAGEMENT_INFO_JAVA_ENABLED:true}

# --- logging -----------------------------------------------------------------
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.kovospace.newtablinks=${LOGGING_LEVEL_APPLICATION:INFO}
