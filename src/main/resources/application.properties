# =============================================================================
# NewTabLinks backend - application configuration
#
# Every parameter is declared here with a working default, in the form
# ${ENVIRONMENT_VARIABLE:default}. Nothing has to be set for the application to
# start locally; a deployment overrides what it needs by setting the matching
# environment variable, and never by editing this file.
#
# Anything genuinely secret (database password above all) has no usable default
# on purpose - it is injected from the cluster secret store at runtime.
# =============================================================================

# --- application identity ----------------------------------------------------
spring.application.name=${SPRING_APPLICATION_NAME:new-tab-links-backend}

# --- http server -------------------------------------------------------------
# 8080 matches the Helm chart's default containerPort, so the probe and the
# service find the application without extra configuration.
server.port=${SERVER_PORT:8080}
# Honour X-Forwarded-* from the ingress. TLS is terminated at Traefik, so without
# this the application believes every request arrived over plain http and builds
# absolute URLs to match - including the OAuth2 redirect_uri, which Google then
# rejects as redirect_uri_mismatch because the registered URI is https.
# Only set this behind a proxy that overwrites these headers; trusting them from
# a directly reachable app would let any caller forge its own scheme and host.
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:FRAMEWORK}
server.error.whitelabel.enabled=${SERVER_ERROR_WHITELABEL_ENABLED:false}
# Return a 404 through the exception handler instead of an empty default page.
spring.web.resources.add-mappings=${SPRING_WEB_RESOURCES_ADD_MAPPINGS:false}

# --- datasource --------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/newtablinks}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:newtablinks}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:newtablinks}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_POOL_MIN_IDLE:2}

# --- jpa / hibernate ---------------------------------------------------------
# The schema is owned by Kovospace/new-tab-links-migrations, which runs as an init
# container before this application starts.
#
# DEPLOYED ENVIRONMENTS MUST SET SPRING_JPA_HIBERNATE_DDL_AUTO=validate, so that
# Hibernate checks the migrated schema instead of quietly changing it.
#
# `update` remains the default only so the application still starts against an
# empty database with no migration image to hand. Note that a schema Hibernate
# builds itself is NOT equivalent to the migrated one: it creates foreign keys
# with no ON DELETE rules, so deleting a group, an environment or an account
# fails on a constraint violation. Run the migration image locally to get a
# schema that behaves like production.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=${SPRING_JPA_TIME_ZONE:UTC}

# --- flyway ------------------------------------------------------------------
# Disabled inside the application on purpose. Migrations live in their own
# repository, are shipped as a Docker image, and run as a Kubernetes init
# container before this pod starts. The application must never migrate its own
# schema - it would race the init container and split ownership of the schema.
#
# The schema version this build expects comes from the Maven property
# flyway.migrations.schema.version and is published at /actuator/info as
# build.flywayMigrationsSchemaVersion. That value IS the tag of the migration
# image the deployment must run, so a pod can be compared against the migration
# that actually ran.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}

# --- openapi / swagger ui ----------------------------------------------------
newtablinks.openapi.title=${NEWTABLINKS_OPENAPI_TITLE:NewTabLinks backend API}
newtablinks.openapi.version=${NEWTABLINKS_OPENAPI_VERSION:v1}
newtablinks.openapi.description=${NEWTABLINKS_OPENAPI_DESCRIPTION:Stores and synchronizes the link hierarchy of the NewTabGroupedLinks browser extension.}
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:alpha}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}

# --- websocket ---------------------------------------------------------------
# Transport only for now; no message is published until user identity exists.
# The default origin pattern allows the Chrome extension, whose pages are served
# from chrome-extension://<extension id>.
newtablinks.websocket.endpoint-path=${NEWTABLINKS_WEBSOCKET_ENDPOINT_PATH:/ws}
newtablinks.websocket.user-destination-prefix=${NEWTABLINKS_WEBSOCKET_USER_DESTINATION_PREFIX:/user}
newtablinks.websocket.allowed-origin-patterns=${NEWTABLINKS_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:chrome-extension://*}

# --- authentication ----------------------------------------------------------
# Access tokens are short lived because nothing can revoke one before it expires;
# revocation acts on the refresh token, which is why that one is stored.
newtablinks.auth.access-token-lifetime=${NEWTABLINKS_AUTH_ACCESS_TOKEN_LIFETIME:PT15M}
newtablinks.auth.refresh-token-lifetime=${NEWTABLINKS_AUTH_REFRESH_TOKEN_LIFETIME:P30D}
newtablinks.auth.activation-token-lifetime=${NEWTABLINKS_AUTH_ACTIVATION_TOKEN_LIFETIME:PT24H}
# Shorter than activation on purpose: a reset link is a live takeover of an existing
# account, whereas an activation link only finishes creating an empty one.
newtablinks.auth.password-reset-token-lifetime=${NEWTABLINKS_AUTH_PASSWORD_RESET_TOKEN_LIFETIME:PT1H}
# The website exchanges this immediately, so it only has to survive one redirect.
newtablinks.auth.web-session-handoff-lifetime=${NEWTABLINKS_AUTH_WEB_HANDOFF_LIFETIME:PT2M}
# Long enough for a person to read a code off one screen and type it into another.
newtablinks.auth.extension-connect-lifetime=${NEWTABLINKS_AUTH_EXTENSION_CONNECT_LIFETIME:PT10M}
newtablinks.auth.maximum-failed-login-attempts=${NEWTABLINKS_AUTH_MAX_FAILED_LOGINS:10}
newtablinks.auth.jwt-issuer=${NEWTABLINKS_AUTH_JWT_ISSUER:https://newtablinks.local}
#
# DEVELOPMENT VALUE ONLY. Every deployment MUST override this with a long random
# secret from the cluster secret store: anyone holding it can mint access tokens
# for any account. The application refuses to start if it is shorter than 32 bytes.
newtablinks.auth.jwt-signing-secret=${NEWTABLINKS_AUTH_JWT_SIGNING_SECRET:development-only-signing-secret-not-for-any-deployment}

# --- security ----------------------------------------------------------------
# Browser origins allowed to call this API: the website, and the extension whose
# pages are served from chrome-extension://<extension id>.
newtablinks.security.allowed-cors-origins=${NEWTABLINKS_SECURITY_ALLOWED_CORS_ORIGINS:http://localhost:5173,chrome-extension://*}

# --- provider sign-in --------------------------------------------------------
# Deliberately NOT declared here. Spring Boot validates client registrations on
# startup and refuses to boot when a declared client id is empty, so declaring
# Google with an empty default would make credentials mandatory just to start.
# The security configuration wires provider sign-in only when a registration
# exists, and logs a warning when it does not.
#
# To enable Google, set these three as environment variables (or add them to a
# profile-specific properties file):
#
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,email,profile
#
# The redirect URI to register in the Google console is
#   <this service's public base url>/login/oauth2/code/google

# --- the public website ------------------------------------------------------
# Separate project; the backend only needs to build links into it.
newtablinks.web.base-url=${NEWTABLINKS_WEB_BASE_URL:http://localhost:5173}
newtablinks.web.activation-path=${NEWTABLINKS_WEB_ACTIVATION_PATH:/activate}
newtablinks.web.oauth-callback-path=${NEWTABLINKS_WEB_OAUTH_CALLBACK_PATH:/auth/callback}
newtablinks.web.password-reset-path=${NEWTABLINKS_WEB_PASSWORD_RESET_PATH:/reset-password}
#
# Shared key the website sends in the X-Frontend-Api-Key header on the few endpoints
# reserved for it - currently only GET /api/v1/auth/username-existence.
#
# NOT A SECRET. It is compiled into a public JavaScript bundle, so anyone who opens
# the site can read it. It buys friction and attribution, never confidentiality:
# never guard anything with it that a leak would actually damage.
#
# It has NO default, and blank means DENY: with nothing set, every endpoint behind it
# refuses every call. That is deliberate - the endpoint discloses whether a username
# is registered, so a deployment that forgets this value must go dark rather than
# quietly publish an account enumeration service.
newtablinks.web.frontend-api-key=${FRONTEND_API_KEY:}

# --- the visitor throttle ----------------------------------------------------
# Two endpoints answer whether a username is registered: the lookup the registration
# form makes while somebody types, and registration itself, which refuses a taken
# name with 409. Both are account enumeration oracles and neither can be closed
# without losing a feature, so what is taken away instead is the speed.
#
# The website asks for a token on page load and sends it on both endpoints. A token
# may not be used immediately, may not be used faster than a person types, and may
# be used only so many times before a new one is needed.
#
# NOT a proof that a human is present, and not a per-address limit. Asking for a
# token is free and anonymous - it has to be - so a caller who holds many tokens at
# once regains their throughput. This makes casual scripted enumeration slow enough
# not to be worth doing; it does not make it impossible. Counting by IP address was
# rejected deliberately: carrier-grade NAT puts whole neighbourhoods behind one
# address, so it would punish real users far more than anyone it aimed at.
#
# minimum-request-interval must stay BELOW the website's own debounce, or real
# typing is refused. The website's debounce is 250ms; this is 200ms on purpose.
newtablinks.visitor-token.enabled=${VISITOR_TOKEN_ENABLED:true}
newtablinks.visitor-token.lifetime=${VISITOR_TOKEN_LIFETIME:PT1H}
newtablinks.visitor-token.minimum-first-use-delay=${VISITOR_TOKEN_MINIMUM_FIRST_USE_DELAY:PT0.5S}
newtablinks.visitor-token.minimum-request-interval=${VISITOR_TOKEN_MINIMUM_REQUEST_INTERVAL:PT0.2S}
newtablinks.visitor-token.maximum-uses=${VISITOR_TOKEN_MAXIMUM_USES:250}
newtablinks.visitor-token.cleanup-interval=${VISITOR_TOKEN_CLEANUP_INTERVAL:PT1H}

# --- the operator -----------------------------------------------------------
# One username and one password that unlock /api/v1/admin, where accounts can be
# read, repaired and deleted. Not an account: there is no row for it, no
# registration, no reset and no second factor.
#
# THIS IS THE MOST VALUABLE SECRET THIS SERVICE HOLDS. It is the entire wall
# between the internet and the ability to delete any account together with every
# environment, group, subgroup and link that account owns. Make it long and
# random - nothing a person would type twice - and rotate it on its own schedule.
#
# BOTH BLANK MEANS DISABLED: with either unset, every administrator sign-in is
# refused and the whole admin surface is unreachable. A deployment that forgets
# these loses a repair tool rather than publishing an unauthenticated one.
#
# Sign-in locks itself after too many consecutive failures, because the
# per-account failed-login counter that protects users cannot protect an identity
# with no account behind it. The counter is per replica, held in memory - two
# pods mean twice the guesses before either locks.
newtablinks.admin.username=${ADMIN_USERNAME:}
newtablinks.admin.password=${ADMIN_PASSWORD:}
newtablinks.admin.token-lifetime=${ADMIN_TOKEN_LIFETIME:PT30M}
newtablinks.admin.maximum-consecutive-failed-attempts=${ADMIN_USER_MAX_CONSECUTIVE_ATTEMPTS:5}
newtablinks.admin.failed-attempts-lock-duration=${ADMIN_USER_BAD_ATTEMPTS_LOCK_TIME:PT5M}

# --- payments: Creem ---------------------------------------------------------
# Creem is the merchant of record. It is a dumb signal: its signed webhook tells
# this service "this account is paid until X", and that is written into
# user_entitlement. Nothing asks Creem on a request whether somebody is pro.
#
# ALL BLANK MEANS DISABLED, and the application still starts:
#   * no CREEM_API_KEY        -> POST /api/v1/payments/checkouts answers 503
#   * no CREEM_WEBHOOK_SECRET -> every webhook delivery is refused with 503,
#                                never accepted unverified
#
# CREEM_API_KEY decides the mode by its prefix: creem_test_... is the sandbox
# (https://test-api.creem.io), any other creem_... key is live
# (https://api.creem.io). Each key only works against its own host, so the host
# is derived from the key. CREEM_API_BASE_URL may be left unset; if it is set and
# names the other host, startup fails instead of the first customer's checkout.
#
# CREEM_WEBHOOK_SECRET is the signing secret of the endpoint registered in the
# Creem dashboard (Developers > Webhooks), a different value per endpoint and per
# mode. Register <public base url>/api/v1/payments/webhooks/creem there.
#
# The product ids are Creem's (prod_...), one per plan, and are what the website's
# "buy" buttons open a checkout for. A plan with no product is simply not on sale.
# CREEM_CHECKOUT_SUCCESS_PATH is where Creem sends the customer after paying,
# relative to NEWTABLINKS_WEB_BASE_URL; blank leaves it to the product's default.
newtablinks.payment.creem.api-key=${CREEM_API_KEY:}
newtablinks.payment.creem.webhook-secret=${CREEM_WEBHOOK_SECRET:}
newtablinks.payment.creem.api-base-url=${CREEM_API_BASE_URL:}
newtablinks.payment.creem.api-timeout=${CREEM_API_TIMEOUT:PT10S}
newtablinks.payment.creem.products.lifetime=${CREEM_LIFETIME_PRODUCT_ID:}
newtablinks.payment.creem.products.subscription=${CREEM_SUBSCRIPTION_PRODUCT_ID:}
newtablinks.payment.creem.checkout.success-path=${CREEM_CHECKOUT_SUCCESS_PATH:/account}

# A lifetime purchase on an account holding a subscription makes that subscription
# pointless, and it would still charge at renewal. The webhook stores the lifetime
# purchase and leaves the subscription pending on the entitlement row; it is then
# cancelled at Creem (immediately, no refund) right after the commit, and retried
# on this interval until Creem confirms. No CREEM_API_KEY -> nothing is attempted
# and the rows stay pending until a key is configured.
newtablinks.payment.subscription-cancellation-retry-interval=${PAYMENT_SUBSCRIPTION_CANCELLATION_RETRY_INTERVAL:PT15M}

# --- outgoing mail -----------------------------------------------------------
# Disabled by default: with no provider configured, messages are written to the log
# with the activation link intact, so the whole flow works in development.
# Set NEWTABLINKS_MAIL_ENABLED=true once SMTP credentials exist.
newtablinks.mail.enabled=${NEWTABLINKS_MAIL_ENABLED:false}
newtablinks.mail.from-address=${NEWTABLINKS_MAIL_FROM_ADDRESS:no-reply@newtablinks.local}
newtablinks.mail.from-name=${NEWTABLINKS_MAIL_FROM_NAME:NewTabLinks}
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
#
# Jakarta Mail leaves all three of these unset, and unset means wait forever - which
# is what `timeout -1` in a MailConnectException means. Sending happens synchronously
# inside the request that triggered it, so with no connect timeout a relay whose port
# is blocked makes the caller wait for the OS to give up on the TCP handshake, around
# two minutes, before the request returns. The outcome is the same either way - the
# account is created and the failure is only logged - so what these buy is the caller
# getting their response back in seconds instead of minutes. Milliseconds.
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_READ_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- actuator ----------------------------------------------------------------
# health is what the Kubernetes probes call; info carries the build metadata,
# including the expected Flyway schema version.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.probes.enabled=${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
management.info.build.enabled=${MANAGEMENT_INFO_BUILD_ENABLED:true}
# The mail relay is deliberately excluded from the health aggregate. Kubernetes
# probes this endpoint for BOTH liveness and readiness, so leaving mail in would
# let an unreachable SMTP relay - a non-critical, best-effort dependency whose
# failures are already caught and logged - restart a perfectly healthy API in a
# loop. Mail problems belong in the logs, not in the liveness probe.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.info.java.enabled=${MANAGEMENT_INFO_JAVA_ENABLED:true}

# --- logging -----------------------------------------------------------------
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.kovospace.newtablinks=${LOGGING_LEVEL_APPLICATION:INFO}
